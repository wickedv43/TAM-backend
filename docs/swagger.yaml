host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
  description: Backend for Telegram WebApp (TAM).
  termsOfService: http://swagger.io/terms/
  title: TAM Backend API
  version: "1.0"
paths:
  /auth:
    post:
      consumes:
      - application/json
      description: Authenticates user via Telegram init data
      parameters:
      - description: Auth request
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/github_com_wickedv43_TAM-backend_internal_common.AuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: ok
          schema:
            type: string
        "400":
          description: Invalid request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal error
          schema:
            type: string
      summary: Authenticate user
      tags:
      - auth
  /briefs/{id}:
    get:
      consumes:
      - application/json
      description: Get brief details by ID
      parameters:
      - description: Brief ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_wickedv43_TAM-backend_internal_common.BriefResponse'
        "400":
          description: Invalid ID
          schema:
            type: string
        "404":
          description: Brief not found
          schema:
            type: string
        "500":
          description: Internal error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get brief
      tags:
      - briefs
    patch:
      consumes:
      - application/json
      description: Update brief details
      parameters:
      - description: Brief ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid ID
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Update brief
      tags:
      - briefs
  /briefs/add-brief:
    post:
      consumes:
      - application/json
      description: Creates a new brief for the user
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_wickedv43_TAM-backend_internal_common.BriefResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create brief
      tags:
      - briefs
  /briefs/list:
    get:
      consumes:
      - application/json
      description: List all briefs for current user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_wickedv43_TAM-backend_internal_common.BriefResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List briefs
      tags:
      - briefs
  /channels/{id}:
    delete:
      consumes:
      - application/json
      description: Delete channel by ID
      parameters:
      - description: Channel ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid ID
          schema:
            type: string
        "500":
          description: Internal error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Delete channel
      tags:
      - channels
    get:
      consumes:
      - application/json
      description: Get channel details
      parameters:
      - description: Channel ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_wickedv43_TAM-backend_internal_common.GetChannelResponse'
        "400":
          description: Invalid request
          schema:
            type: string
        "404":
          description: Channel not found
          schema:
            type: string
        "500":
          description: Internal error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get channel
      tags:
      - channels
  /channels/add-channel:
    post:
      consumes:
      - application/json
      description: Add a new Telegram channel
      parameters:
      - description: Channel details
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/github_com_wickedv43_TAM-backend_internal_common.AddChannelRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_wickedv43_TAM-backend_internal_common.CreateChannelResponse'
        "400":
          description: Invalid request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "409":
